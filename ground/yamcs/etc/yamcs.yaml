services:
  - class: org.yamcs.http.HttpServer
    args:
      port: 8090
      address: "0.0.0.0"
      # Request bodies up to 32 MiB. A bucket upload is capped at the larger of this and UploadObject's own
      # 5 MiB, and an uplinked IWAD (freedoom2.wad, 28.8 MB) goes into a bucket in one request.
      maxContentLength: 33554432
      cors:
        allowOrigin: "*"
        allowCredentials: false

# This is where Yamcs will persist its data. Paths are resolved relative to where Yamcs is running
# from (by default: target/yamcs). This means that `mvn clean` will remove also persisted data.
# Change this property to an absolute path in case you want to persist your data.
#
# Note: this is overridden when running the fprime-yamcs script.
dataDir: yamcs-data

instances:
  - fprime-project

# Secret key unique to a particular Yamcs installation.
# This is used to provide cryptographic signing.
secretKey: changeme
