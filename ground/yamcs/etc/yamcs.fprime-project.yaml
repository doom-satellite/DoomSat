services:
  - class: org.yamcs.archive.XtceTmRecorder
  - class: org.yamcs.archive.ParameterRecorder
  - class: org.yamcs.archive.AlarmRecorder
  - class: org.yamcs.archive.EventRecorder
  - class: org.yamcs.archive.ReplayServer
  - class: org.yamcs.parameter.SystemParametersService
    args:
      producers:
        - fs
        - jvm
  - class: org.yamcs.ProcessorCreatorService
    args:
      name: realtime
      type: realtime
  - class: org.yamcs.archive.CommandHistoryRecorder
  - class: org.yamcs.parameterarchive.ParameterArchive
    args:
      realtimeFiller:
        enabled: true
  # Instantiated explicitly to bound its parameter cache; the implicit default
  # caches every processed value without limit and can exhaust the heap.
  # cacheAll false: only parameters actually retrieved get cached, so
  # high-rate realtime-only telemetry just flows through uncached.
  - class: org.yamcs.parameter.ParameterRetrievalService
    args:
      parameterCache:
        cacheAll: false
        maxNumEntries: 32
        duration: 60
  - class: org.yamcs.plists.ParameterListService
  - class: org.yamcs.timeline.TimelineService
  - class: org.yamcs.ProcessRunner
    args:
      command: ["fprime-yamcs-events"]
      restart: "always"
      logLevel: INFO
  # Splits aggregate Svc.TlmChan packets (APID 1) into single-record packets re-injected
  # on UDP_TM_SPLIT_IN, so YAMCS decodes every channel record rather than only the first.
  - class: org.yamcs.ProcessRunner
    args:
      command: ["fprime-yamcs-tlmchan"]
      restart: "always"
      logLevel: INFO
  # CFDP (Stage 2 spike, docs/plans/cfdp-stage2-spike.md) in place of fprime-yamcs's FprimeFilePacketService: the
  # flight software runs Svc/Ccsds/CfdpManager instead of FileUplink/FileDownlink, so nothing on board speaks
  # Fw::FilePacket any more. PDUs travel on APID 3 behind the F' descriptor 0x0003 both ways; cfdp_streams.sql wraps
  # and unwraps them, and UDP_TC_OUT's virtual channel 2 carries them up behind the commands on channel 1.
  - class: org.yamcs.cfdp.CfdpService
    name: cfdp
    args:
      inStream: cfdp_in
      outStream: cfdp_out
      incomingBucket: cfdpDown
      localEntities:
        - name: ground
          id: 100                   # cfdpManager FileInDefaultDestEntityId; the destId to give SendFile
      remoteEntities:
        - name: doomsat
          id: 42                    # cfdpManager LocalEid
      entityIdLength: 2
      sequenceNrLength: 4           # <= 4: F' keeps transaction numbers in a U32
      maxPduSize: 1009              # 1024-byte TC frame - 5 header - 2 FECF - 6 space packet header - 2 descriptor
      checksumType: MODULAR         # what F' checks; Yamcs 5.12.8 has no CRC32
      sleepBetweenPdus: 40          # one PDU every 40 ms, about the Stage 1 rate; see the findings for others
      canChangePduDelay: true
      pduDelayPredefinedValues: [5, 10, 20, 40, 100]
      maxNumPendingUploads: 1
      eofAckTimeout: 3000
      eofAckLimit: 10
      finAckTimeout: 3000
      finAckLimit: 10
      immediateNak: true
      nakTimeout: 3000              # longer than cfdpManager's 1 s cycle
      nakLimit: 10
      inactivityTimeout: 30000
      # A finished transfer keeps answering PDUs by (entity, sequence number) this long. F' numbers its transactions
      # from 1 at every boot, so after a flight-only restart a new downlink could land on an old transfer for the
      # default 10 min. 60 s still outlasts F's FIN retries (ack_timer 2 s x ack_limit 10).
      pendingAfterCompletion: 60000
      hasDownloadCapability: false  # F' v4.3.0 has no Proxy Put: downlinks start on board (cfdpManager.SendFile)
      hasFileListingCapability: false
      senderFaultHandlers:
        AckLimitReached: suspend

dataLinks:
  - name: UDP_TM_IN
    class: org.yamcs.tctm.ccsds.UdpTmFrameLink
    port: 50000
    frameType: "TM"
    spacecraftId: 68
    frameLength: 1024
    errorDetection: CRC16
    virtualChannels:
      - vcId: 1
        ocfPresent: false
        service: "PACKET"
        maxPacketLength: 65542  # CCSDS Space Packet maximum: 65536 data bytes + 6 header bytes
        packetPreprocessorClassName: com.example.myproject.FprimePacketPreprocessor
        stream: "tm_realtime"

  - name: UDP_TM_SPLIT_IN
    class: org.yamcs.tctm.UdpTmDataLink
    stream: tm_realtime
    port: 50002
    packetPreprocessorClassName: com.example.myproject.FprimePacketPreprocessor

  - name: UDP_TC_OUT
    class: org.yamcs.tctm.ccsds.UdpTcFrameLink
    host: localhost
    port: 50001
    spacecraftId: 68
    maxFrameLength: 1024
    errorDetection: CRC16
    priorityScheme: ABSOLUTE
    virtualChannels:
      - vcId: 1
        ocfPresent: false
        service: "PACKET"
        priority: 10
        # One space packet per TC frame. By default Yamcs packs every queued command that fits into one frame,
        # and F' v4.3.0's SpacePacketDeframer reads only the first packet of a frame and drops the rest without
        # an event: 19 to 36 of 100 commands issued together were lost, and a file uplink failed its checksum.
        multiplePacketsPerFrame: false
        commandPostprocessorClassName: com.example.myproject.FprimeCommandPostprocessor
        stream: "tc_realtime"
        useCop1: false
      # CFDP PDUs (cfdp_streams.sql), after anything waiting on channel 1: ABSOLUTE priority, not FIFO, because
      # every PDU carries its transfer's start time and FIFO would put the whole transfer ahead of commands
      - vcId: 2
        ocfPresent: false
        service: "PACKET"
        priority: 1
        multiplePacketsPerFrame: false
        commandPostprocessorClassName: com.example.myproject.FprimeCommandPostprocessor
        stream: "cfdp_tc"
        useCop1: false
        tcQueueSize: 64

mdb:
  # Configuration of the active loaders
  # Valid loaders are: sheet, xtce or fully qualified name of the class
  - type: xtce
    args:
      file: mdb/fprime.xtce.xml
  # Ground-side (software) parameters for the Doom pilot: reassembled image products for Open MCT
  - type: xtce
    args:
      file: mdb/doom-ground.xtce.xml

# Configuration for streams created at server startup
streamConfig:
  tm:
    - name: "tm_realtime"
      processor: "realtime"
    - name: "tm_dump"
  cmdHist: ["cmdhist_realtime", "cmdhist_dump"]
  event: ["events_realtime", "events_dump"]
  param: ["pp_realtime", "pp_dump", "sys_param", "proc_param"]
  parameterAlarm: ["alarms_realtime"]
  tc:
    - name: "tc_realtime"
      processor: "realtime"
  # Last: it reads tm_realtime and must come after the streams above (ground/yamcs/launch.py keeps the order).
  # An absolute path, because Yamcs runs from the F' project directory; DOOMSAT_REPO comes from scripts/common.sh.
  sqlFile: "${env.DOOMSAT_REPO}/ground/yamcs/etc/cfdp_streams.sql"
